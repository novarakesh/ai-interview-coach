[build]
  command = "npm install --prefix client && npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

# Route API calls to the Express backend running as a Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback so client-side routes (e.g. /dashboard) don't 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
